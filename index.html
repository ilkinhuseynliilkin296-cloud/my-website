<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首页</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:#f5f5f5; padding-bottom:55px;}
a{text-decoration:none; color:inherit;}
</style>
</head>
<body>

<!-- 🔝 顶部搜索栏 -->
<div style="background:#ff6a00; padding:10px 12px; padding-top:25px;">
  <div style="display:flex; align-items:center; gap:8px;">
    <input type="text" placeholder="搜索商品、店铺" style="flex:1; border:none; border-radius:20px; padding:8px 14px; font-size:14px; outline:none;">
    <span style="color:#fff; font-size:18px;">👤</span>
    <span style="color:#fff; font-size:16px;">❤️</span>
  </div>
  <div style="display:flex; color:#fff; font-size:14px; margin-top:10px; gap:20px;">
    <span style="border-bottom:2px solid #fff; padding-bottom:3px; font-weight:bold;">精选</span>
    <span>按货</span>
    <span>工业</span>
    <span>筛选 ⚙️</span>
  </div>
</div>

<!-- 🧭 功能入口 + 国家筛选 -->
<div style="background:#fff; margin:10px 12px; border-radius:10px; padding:14px 8px;">
  <div style="display:grid; grid-template-columns:repeat(5,1fr); text-align:center; gap:5px;">
    <div><div style="font-size:22px;">🔥</div><div style="font-size:11px; margin-top:2px;">爆品推荐</div></div>
    <div><div style="font-size:22px;">📦</div><div style="font-size:11px; margin-top:2px;">全部分类</div></div>
    <div><div style="font-size:22px;">🏷️</div><div style="font-size:11px; margin-top:2px;">货源市场</div></div>
    <div><div style="font-size:22px;">📊</div><div style="font-size:11px; margin-top:2px;">行情分析</div></div>
    <div><div style="font-size:22px;">🔍</div><div style="font-size:11px; margin-top:2px;">搜索货源</div></div>
  </div>
  <div style="margin-top:12px; padding-top:10px; border-top:1px solid #f5f5f5; font-size:13px; color:#666;">
    🌍 国家/地区：
    <select style="border:1px solid #eee; padding:3px 6px; border-radius:5px; margin-left:4px; font-size:13px;">
      <option>全部国家</option>
      <option>中国</option>
      <option>俄罗斯</option>
      <option>吉尔吉斯斯坦</option>
    </select>
  </div>
</div>

<!-- 🔥 爆品推荐 一行3个 -->
<div style="padding:0 12px; margin-bottom:15px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <span style="font-size:15px; font-weight:bold;">🔥 爆品推荐</span>
    <span style="font-size:13px; color:#999;">查看更多 →</span>
  </div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
    <a href="#" style="background:#fff; border-radius:8px; text-align:center; padding:15px 5px;">
      <div style="font-size:32px; margin-bottom:8px;">👖</div>
      <div style="color:#ff6a00; font-weight:bold; font-size:15px;">¥26</div>
    </a>
    <a href="#" style="background:#fff; border-radius:8px; text-align:center; padding:15px 5px;">
      <div style="font-size:32px; margin-bottom:8px;">👚</div>
      <div style="color:#ff6a00; font-weight:bold; font-size:15px;">¥30</div>
    </a>
    <a href="#" style="background:#fff; border-radius:8px; text-align:center; padding:15px 5px;">
      <div style="font-size:32px; margin-bottom:8px;">🥿</div>
      <div style="color:#ff6a00; font-weight:bold; font-size:15px;">¥12</div>
    </a>
  </div>
</div>

<!-- 📦 为您推荐 一行2个 -->
<div style="padding:0 12px;">
  <div style="font-size:15px; font-weight:bold; margin-bottom:10px;">为您推荐</div>
  <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">

    <a href="#" style="background:#fff; border-radius:8px; overflow:hidden; display:block; position:relative;">
      <div style="position:absolute; top:6px; left:6px; background:#ff6a00; color:#fff; font-size:11px; padding:2px 5px; border-radius:3px; z-index:2;">佣金12%</div>
      <div style="position:absolute; top:6px; right:6px; font-size:15px; color:#ccc; z-index:2;">❤️</div>
      <div style="height:120px; background:#f8f8f8; display:flex; align-items:center; justify-content:center; font-size:38px;">🧥</div>
      <div style="padding:9px;">
        <div style="font-size:13px; color:#333; height:36px; line-height:18px; overflow:hidden;">运动休闲外套 防风透气春秋款</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
          <span style="color:#ff6a00; font-weight:bold; font-size:16px;">¥89</span>
          <span style="font-size:11px; color:#999;">已售2580</span>
        </div>
      </div>
    </a>

    <a href="#" style="background:#fff; border-radius:8px; overflow:hidden; display:block; position:relative;">
      <div style="position:absolute; top:6px; left:6px; background:#ff6a00; color:#fff; font-size:11px; padding:2px 5px; border-radius:3px; z-index:2;">佣金15%</div>
      <div style="position:absolute; top:6px; right:6px; font-size:15px; color:#ccc; z-index:2;">❤️</div>
      <div style="height:120px; background:#f8f8f8; display:flex; align-items:center; justify-content:center; font-size:38px;">🧥</div>
      <div style="padding:9px;">
        <div style="font-size:13px; color:#333; height:36px; line-height:18px; overflow:hidden;">温柔风针织毛衣 软糯亲肤</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
          <span style="color:#ff6a00; font-weight:bold; font-size:16px;">¥58</span>
          <span style="font-size:11px; color:#999;">已售3420</span>
        </div>
      </div>
    </a>

  </div>
</div>

<!-- 🧭 底部导航 -->
<div style="position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:grid; grid-template-columns:repeat(5,1fr); padding:4px 0; padding-bottom:8px;">
  <a href="#" style="text-align:center; color:#ff6a00;">
    <div style="font-size:20px;">🏠</div>
    <div style="font-size:11px;">首页</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">🛒</div>
    <div style="font-size:11px;">商城</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">📋</div>
    <div style="font-size:11px;">任务</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">💰</div>
    <div style="font-size:11px;">钱包</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">👤</div>
    <div style="font-size:11px;">我的</div>
  </a>
</div>

</body>
</html>
