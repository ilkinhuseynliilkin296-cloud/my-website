<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球商城 · 电商任务平台</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, sans-serif;}
    body {background:linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color:white; min-height:100vh;}
    header {display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:rgba(0,0,0,0.15);}
    .logo {font-size:1.25rem; font-weight:700;}
    .header-actions {display:flex; gap:1rem; align-items:center;}
    select {padding:0.4rem 0.8rem; border-radius:6px; border:none; background:white; color:#1e3a8a; font-weight:500; cursor:pointer;}
    .btn {padding:0.5rem 1.2rem; border-radius:6px; border:none; font-weight:600; cursor:pointer;}
    .btn-login {background:white; color:#1e3a8a;}
    .btn-register {background:#facc15; color:#1e3a8a;}
    .hero {padding:3rem 2rem; text-align:center;}
    .hero h1 {font-size:2.5rem; margin-bottom:1rem;}
    .hero p {font-size:1.15rem; opacity:0.9; margin-bottom:2.5rem;}
    .stats {display:flex; justify-content:center; gap:2rem; flex-wrap:wrap; margin-bottom:3rem;}
    .stat-card {background:rgba(255,255,255,0.2); padding:1.5rem 2.5rem; border-radius:12px; backdrop-filter:blur(8px);}
    .stat-label {font-size:0.95rem; opacity:0.8; margin-bottom:0.5rem;}
    .stat-value {font-size:2rem; font-weight:700;}
    .section {padding:2rem;}
    .section h2 {text-align:center; margin-bottom:2rem;}
    .grid {display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1.2rem; max-width:1000px; margin:0 auto;}
    .grid-item {background:rgba(255,255,255,0.15); padding:1.2rem; border-radius:10px; text-align:center; font-weight:500;}
    .grid-2 {display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1rem; max-width:1000px; margin:0 auto;}
    .grid-item-2 {background:rgba(255,255,255,0.12); padding:1rem; border-radius:8px; text-align:center;}
    .contact {padding:2rem; text-align:center; background:rgba(0,0,0,0.15);}
    .contact-links {margin-top:1rem; display:flex; justify-content:center; gap:2rem; flex-wrap:wrap;}
  </style>
</head>
<body>
  <header>
    <div class="logo">🌐 全球电商平台</div>
    <div class="header-actions">
      <select id="lang">
        <option value="zh">🇨🇳 中文</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
      <button class="btn btn-login">登录账户</button>
      <button class="btn btn-register">立即注册</button>
    </div>
  </header>

  <section class="hero">
    <h1>全球商城 · 电商任务平台</h1>
    <p>商品 · 订单 · 佣金 · 提现 · 一站式全球电商任务系统</p>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">今日收益</div>
        <div class="stat-value">$1,258.68</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">累计佣金</div>
        <div class="stat-value">$45,892.35</div>
      </div>
    </div>
  </section>

  <section class="section" style="background:rgba(255,255,255,0.08);">
    <h2>核心功能</h2>
    <div class="grid">
      <div class="grid-item">✅ 商品浏览</div>
      <div class="grid-item">✅ 一键接单</div>
      <div class="grid-item">✅ 实时佣金</div>
      <div class="grid-item">✅ 每日收益</div>
    </div>
  </section>

  <section class="section">
    <h2>平台优势</h2>
    <div class="grid-2">
      <div class="grid-item-2">⭐ 覆盖 200+ 国家</div>
      <div class="grid-item-2">⭐ 全球商家合作</div>
      <div class="grid-item-2">⭐ 安全资金系统</div>
      <div class="grid-item-2">⭐ 24 小时客服</div>
      <div class="grid-item-2">⭐ 快速提现</div>
      <div class="grid-item-2">⭐ 智能订单匹配</div>
    </div>
  </section>

  <section class="contact">
    <h2>联系我们</h2>
    <div class="contact-links">
      <span>📩 Telegram</span>
      <span>💬 WhatsApp</span>
      <span>📧 support@example.com</span>
    </div>
  </section>
</body>
</html>
