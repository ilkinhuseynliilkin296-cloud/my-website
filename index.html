<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>钱包 — 全球商家商城</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC", "Microsoft YaHei", sans-serif;}
    :root {--primary:#FF6A00; --bg:#F5F5F5; --card:#fff; --text:#333; --green:#52C41A; --red:#FF4D4F;}
    body {background:var(--bg); max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:70px;}

    .header {background:linear-gradient(135deg, #FF6A00, #FF9500); color:#fff; padding:24px 16px 40px; border-radius:0 0 24px 24px; text-align:center;}
    .balance-label {font-size:14px; opacity:0.9;}
    .balance-num {font-size:36px; font-weight:800; margin:8px 0;}
    .balance-row {display:flex; justify-content:center; gap:30px; margin-top:12px; font-size:13px;}
    .balance-row span {opacity:0.9;}

    .btn-wrap {display:flex; gap:12px; padding:0 16px; margin:-20px 0 20px;}
    .btn {flex:1; background:#fff; color:var(--primary); border:none; padding:12px; border-radius:10px; font-size:15px; font-weight:600; box-shadow:0 4px 8px rgba(0,0,0,0.06);}
    .btn.primary {background:var(--primary); color:#fff;}

    .section {padding:0 16px;}
    .sec-title {font-size:16px; font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between;}
    .bill-item {background:#fff; border-radius:8px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
    .bill-left h4 {font-size:14px; margin-bottom:4px;}
    .bill-left p {font-size:12px; color:#888;}
    .bill-plus {color:var(--green); font-weight:600; font-size:15px;}
    .bill-minus {color:var(--red); font-weight:600; font-size:15px;}

    .tab-bar {position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #eee; display:flex; padding:6px 0 8px; z-index:999;}
    .tab-item {flex:1; text-align:center; font-size:11px; color:#888;}
    .tab-item.active {color:var(--primary);}
    .tab-icon {font-size:22px; margin-bottom:2px;}
  </style>
</head>
<body>

  <div class="header">
    <div class="balance-label">可提现余额</div>
    <div class="balance-num">$12,580.68</div>
    <div class="balance-row">
      <span>今日收益 +$1,258.68</span>
      <span>累计佣金 $45,892.35</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn primary">💰 立即提现</button>
    <button class="btn">📊 收益明细</button>
  </div>

  <div class="section">
    <h2 class="sec-title">最近收支 <a href="#" style="font-size:13px; color:#FF6A00;">查看全部</a></h2>
    <div class="bill-item">
      <div class="bill-left"><h4>订单佣金 — 俄罗斯蜂蜜</h4><p>2026-08-24 10:28</p></div>
      <div class="bill-plus">+$12.85</div>
    </div>
    <div class="bill-item">
      <div class="bill-left"><h4>提现申请</h4><p>2026-08-23 15:30</p></div>
      <div class="bill-minus">-$500.00</div>
    </div>
    <div class="bill-item">
      <div class="bill-left"><h4>邀请好友奖励</h4><p>2026-08-22 09:15</p></div>
      <div class="bill-plus">+$5.00</div>
    </div>
  </div>

  <div class="tab-bar">
    <a href="index.html" class="tab-item"><div class="tab-icon">🏠</div><div>首页</div></a>
    <a href="mall.html" class="tab-item"><div class="tab-icon">🛍️</div><div>商城</div></a>
    <a href="task.html" class="tab-item"><div class="tab-icon">📋</div><div>任务</div></a>
    <a href="wallet.html" class="tab-item active"><div class="tab-icon">💰</div><div>钱包</div></a>
    <a href="mine.html" class="tab-item"><div class="tab-icon">👤</div><div>我的</div></a>
  </div>
</body>
</html>
