<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:"微软雅黑",sans-serif;}
body{background:#f5f5f5; padding-bottom:60px;}
a{text-decoration:none;}
</style>
</head>
<body>

<!-- 顶部橙色搜索 -->
<div style="background:#ff6a00; padding:12px 15px; padding-top:30px;">
  <div style="display:flex; align-items:center;">
    <input type="text" placeholder="搜索商品、店铺" style="flex:1; border:none; border-radius:20px; padding:8px 15px; outline:none; font-size:14px;">
    <span style="color:#fff; font-size:18px; margin-left:10px;">👤</span>
    <span style="color:#fff; font-size:16px; margin-left:8px;">❤️</span>
  </div>
  <div style="display:flex; color:#fff; margin-top:10px; font-size:15px;">
    <span style="padding-bottom:4px; border-bottom:2px solid #fff; font-weight:bold;">精选</span>
    <span style="margin-left:25px;">按货</span>
    <span style="margin-left:25px;">工业</span>
    <span style="margin-left:25px;">筛选 ⚙️</span>
  </div>
</div>

<!-- 功能入口 -->
<div style="background:#fff; margin:10px 15px; border-radius:10px; padding:15px 10px;">
  <div style="display:grid; grid-template-columns:repeat(5,1fr); text-align:center;">
    <div><div style="font-size:24px;">🔥</div><div style="font-size:11px; margin-top:3px;">爆品推荐</div></div>
    <div><div style="font-size:24px;">📦</div><div style="font-size:11px; margin-top:3px;">全部分类</div></div>
    <div><div style="font-size:24px;">🏷️</div><div style="font-size:11px; margin-top:3px;">货源市场</div></div>
    <div><div style="font-size:24px;">📊</div><div style="font-size:11px; margin-top:3px;">行情分析</div></div>
    <div><div style="font-size:24px;">🔍</div><div style="font-size:11px; margin-top:3px;">搜索货源</div></div>
  </div>
  <div style="margin-top:12px; padding-top:10px; border-top:1px solid #f5f5f5; font-size:13px; color:#666;">
    🌍 国家/地区：
    <select style="border:1px solid #eee; padding:3px 8px; border-radius:5px; margin-left:5px;">
      <option>全部国家</option>
      <option>中国</option>
      <option>俄罗斯</option>
      <option>吉尔吉斯斯坦</option>
    </select>
  </div>
</div>

<!-- 爆品推荐 一行3个 -->
<div style="padding:0 15px; margin-bottom:15px;">
  <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
    <span style="font-size:15px; font-weight:bold;">🔥 爆品推荐</span>
    <span style="font-size:13px; color:#999;">查看更多 →</span>
  </div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
    <a href="#" style="background:#fff; border-radius:8px; text-align:center; padding:15px 5px;">
      <div style="font-size:35px;">👖</div>
      <div style="color:#ff6a00; font-weight:bold; margin-top:8px;">¥26</div>
    </a>
    <a href="#" style="background:#fff; border-radius:8px; text-align:center; padding:15px 5px;">
      <div style="font-size:35px;">👚</div>
      <div style="color:#ff6a00; font-weight:bold; margin-top:8px;">¥30</div>
    </a>
    <a href="#" style="background:#fff; border-radius:8px; text-align:center; padding:15px 5px;">
      <div style="font-size:35px;">🥿</div>
      <div style="color:#ff6a00; font-weight:bold; margin-top:8px;">¥12</div>
    </a>
  </div>
</div>

<!-- 为您推荐 一行2个 -->
<div style="padding:0 15px;">
  <div style="font-size:15px; font-weight:bold; margin-bottom:10px;">为您推荐</div>
  <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">

    <a href="#" style="background:#fff; border-radius:8px; overflow:hidden; position:relative;">
      <div style="position:absolute; top:8px; left:8px; background:#ff6a00; color:#fff; font-size:11px; padding:2px 5px; border-radius:3px;">佣金12%</div>
      <div style="position:absolute; top:8px; right:8px; font-size:15px; color:#ccc;">❤️</div>
      <div style="height:120px; background:#f8f8f8; display:flex; align-items:center; justify-content:center; font-size:40px;">🧥</div>
      <div style="padding:10px;">
        <div style="font-size:13px; color:#333; height:35px; overflow:hidden;">运动休闲外套 防风透气春秋款</div>
        <div style="display:flex; justify-content:space-between; margin-top:8px; align-items:center;">
          <span style="color:#ff6a00; font-weight:bold; font-size:16px;">¥89</span>
          <span style="font-size:11px; color:#999;">已售2580</span>
        </div>
      </div>
    </a>

    <a href="#" style="background:#fff; border-radius:8px; overflow:hidden; position:relative;">
      <div style="position:absolute; top:8px; left:8px; background:#ff6a00; color:#fff; font-size:11px; padding:2px 5px; border-radius:3px;">佣金15%</div>
      <div style="position:absolute; top:8px; right:8px; font-size:15px; color:#ccc;">❤️</div>
      <div style="height:120px; background:#f8f8f8; display:flex; align-items:center; justify-content:center; font-size:40px;">🧥</div>
      <div style="padding:10px;">
        <div style="font-size:13px; color:#333; height:35px; overflow:hidden;">温柔风针织毛衣 软糯亲肤</div>
        <div style="display:flex; justify-content:space-between; margin-top:8px; align-items:center;">
          <span style="color:#ff6a00; font-weight:bold; font-size:16px;">¥58</span>
          <span style="font-size:11px; color:#999;">已售3420</span>
        </div>
      </div>
    </a>

  </div>
</div>

<!-- 底部导航 -->
<div style="position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:grid; grid-template-columns:repeat(5,1fr); padding:5px 0; padding-bottom:8px;">
  <a href="#" style="text-align:center; color:#ff6a00;">
    <div style="font-size:20px;">🏠</div>
    <div style="font-size:11px;">首页</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">🛒</div>
    <div style="font-size:11px;">商城</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">📋</div>
    <div style="font-size:11px;">任务</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">💰</div>
    <div style="font-size:11px;">钱包</div>
  </a>
  <a href="#" style="text-align:center; color:#999;">
    <div style="font-size:20px;">👤</div>
    <div style="font-size:11px;">我的</div>
  </a>
</div>

</body>
</html>
