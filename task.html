<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>任务中心 — 全球商家商城</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color:transparent;}
    :root {--primary:#FF6A00; --purple:#7B2FFD; --green:#52C41A; --red:#FF4D4F; --bg:#F5F5F5; --card:#fff; --text:#333; --text2:#888; --border:#eee;}
    html, body {background:var(--bg); max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:70px;}
    a {text-decoration:none; color:inherit; display:block;}

    /* 顶部：阿里橙渐变 */
    .header {background:linear-gradient(135deg, #FF8A00, #FF6A00); color:#fff; padding:30px 16px 20px; border-radius:0 0 20px 20px;}
    .header h1 {font-size:20px; margin-bottom:12px;}

    /* 今日收益卡片 */
    .income-card {background:#fff; border-radius:12px; padding:16px; margin:-10px 16px 12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); position:relative; z-index:1;}
    .income-top {display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
    .income-label {font-size:14px; color:#666;}
    .income-val {font-size:28px; font-weight:700; color:var(--primary);}
    .income-rate {font-size:13px; color:var(--green); margin-left:6px;}
    .remain-wrap {text-align:right;}
    .remain-label {font-size:12px; color:#aaa;}
    .remain-val {font-size:15px; font-weight:600; color:var(--purple);}

    /* 任务进度条 */
    .progress-card {background:#fff; border-radius:12px; padding:14px 16px; margin:0 16px 12px; box-shadow:0 2px 8px rgba(0,0,0,0.04);}
    .progress-head {display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
    .progress-title {font-size:15px; font-weight:600;}
    .progress-level {font-size:14px; color:var(--purple); font-weight:600;}
    .progress-bar {height:8px; background:#eee; border-radius:4px; overflow:hidden; margin-bottom:6px;}
    .progress-fill {height:100%; width:60%; background:linear-gradient(90deg, #7B2FFD, #B066FF); border-radius:4px; transition:width 0.5s ease;}
    .progress-text {font-size:12px; color:#888; text-align:right;}

    /* 推荐任务标题 */
    .sec-title {font-size:16px; font-weight:600; margin:0 16px 10px;}

    /* 推荐任务卡片 */
    .task-card {background:#fff; border-radius:12px; padding:14px; margin:0 16px 10px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 6px rgba(0,0,0,0.04); cursor:pointer; transition:transform 0.15s;}
    .task-card:active {transform:scale(0.98);}
    .task-img {width:72px; height:72px; border-radius:8px; background:linear-gradient(135deg,#f5f5f5,#e8e8e8); display:flex; align-items:center; justify-content:center; font-size:36px; color:#bbb; flex-shrink:0;}
    .task-info {flex:1; min-width:0;}
    .task-name {font-size:15px; font-weight:600; margin-bottom:4px;}
    .task-rate-tag {display:inline-block; background:rgba(255,106,0,0.1); color:var(--primary); font-size:11px; padding:1px 8px; border-radius:10px; margin-bottom:4px;}
    .task-estimate {font-size:12px; color:#666;}
    .task-price {font-size:15px; font-weight:700; color:#333; margin-top:4px;}
    .btn-take {background:linear-gradient(90deg, #FF8A00, #FF6A00); color:#fff; border:none; border-radius:16px; padding:8px 14px; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer; box-shadow:0 2px 6px rgba(255,106,0,0.25);}

    /* 底部导航：任务高亮 */
    .tab-bar {position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #eee; display:flex; padding:8px 0 10px; z-index:999;}
    .tab-item {flex:1; text-align:center; font-size:11px; color:#999; text-decoration:none;}
    .tab-item.active .tab-icon,
    .tab-item.active div:last-child {color:var(--primary);}
    .tab-icon {font-size:22px; margin-bottom:2px; display:block; color:#999;}
  </style>
</head>
<body>

  <!-- 顶部 -->
  <div class="header">
    <h1>📋 任务中心</h1>
  </div>

  <!-- 今日收益卡片 -->
  <div class="income-card">
    <div class="income-top">
      <div>
        <div class="income-label">今日收益</div>
        <div style="display:flex; align-items:baseline;">
          <span class="income-val">¥368.50</span>
          <span class="income-rate">+12.8%</span>
        </div>
      </div>
      <div class="remain-wrap">
        <div class="remain-label">剩余任务</div>
        <div class="remain-val">12 / 20</div>
      </div>
    </div>
  </div>

  <!-- 今日任务进度 -->
  <div class="progress-card">
    <div class="progress-head">
      <span class="progress-title">今日任务进度</span>
      <span class="progress-level">Lv.3</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-text">12 / 20 已完成</div>
  </div>

  <!-- 推荐任务 -->
  <h2 class="sec-title">🔥 推荐任务</h2>
  <div class="task-card" onclick="goDetail()">
    <div class="task-img">🎧</div>
    <div class="task-info">
      <div class="task-name">无线蓝牙耳机 Pro</div>
      <span class="task-rate-tag">佣金 15%</span>
      <div class="task-estimate">预计收益 ¥28.80</div>
      <div class="task-price">¥899.00</div>
    </div>
    <button class="btn-take" onclick="event.stopPropagation(); goDetail()">立即接单</button>
  </div>

  <!-- 底部导航：任务高亮 -->
  <div class="tab-bar">
    <a href="index.html" class="tab-item">
      <span class="tab-icon">🏠</span>
      <div>首页</div>
    </a>
    <a href="mall.html" class="tab-item">
      <span class="tab-icon">🛍️</span>
      <div>商城</div>
    </a>
    <a href="task.html" class="tab-item active">
      <span class="tab-icon">📋</span>
      <div>任务</div>
    </a>
    <a href="wallet.html" class="tab-item">
      <span class="tab-icon">💰</span>
      <div>钱包</div>
    </a>
    <a href="mine.html" class="tab-item">
      <span class="tab-icon">👤</span>
      <div>我的</div>
    </a>
  </div>

  <script>
    // 完整流程：商品详情 → 确认订单 → 提交 → 售出 → 佣金到账
    function goDetail(){
      alert('【第一步】进入商品详情页');
      setTimeout(()=>{
        alert('【第二步】确认订单信息，提交下单');
        setTimeout(()=>{
          alert('【第三步】订单提交成功！等待发货确认...');
          setTimeout(()=>{
            alert('【第四步】✅ 商品售出！获得佣金 ¥28.80');
            setTimeout(()=>{
              alert('【第五步】💰 佣金已自动到账钱包！可前往「钱包」查看余额明细');
            }, 800);
          }, 1200);
        }, 800);
      }, 600);
    }
  </script>
</body>
</html>
