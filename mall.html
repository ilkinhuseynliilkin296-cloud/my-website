<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商城 — 全球商家商城</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color:transparent;}
    :root {--primary:#FF6A00; --bg:#F5F5F5; --card:#fff; --text:#333; --text2:#888; --border:#eee; --tag-bg:#FFF0E0; --tag-text:#FF6A00;}
    html, body {background:var(--bg); max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:70px;}
    a {text-decoration:none; color:inherit; display:block;}

    /* 顶部：搜索栏 */
    .header {background:linear-gradient(135deg, #FF8A00, #FF6A00); padding:30px 16px 16px; border-radius:0 0 20px 20px;}
    .search-bar {background:#fff; border-radius:24px; padding:10px 16px; display:flex; align-items:center; gap:8px;}
    .search-bar input {border:none; outline:none; flex:1; font-size:15px; color:#333;}

    /* 筛选栏：分类 + 国家 */
    .filter-wrap {padding:12px 16px 8px; background:#fff;}
    .filter-row {display:flex; gap:10px; align-items:center; overflow-x:auto; padding-bottom:4px;}
    .filter-tab {white-space:nowrap; padding:6px 14px; border-radius:16px; font-size:14px; background:#f5f5f5; color:#666; cursor:pointer;}
    .filter-tab.active {background:var(--primary); color:#fff;}
    .country-select {white-space:nowrap; padding:6px 12px; border-radius:16px; font-size:14px; background:#f5f5f5; color:#666; cursor:pointer; display:flex; align-items:center; gap:4px;}

    /* 商品列表 */
    .pro-list {display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:12px;}
    .pro-card {background:#fff; border-radius:12px; overflow:hidden; cursor:pointer; position:relative; box-shadow:0 2px 6px rgba(0,0,0,0.04); transition:transform 0.15s;}
    .pro-card:active {transform:scale(0.97);}
    .pro-img-wrap {position:relative; width:100%; aspect-ratio:1; background:linear-gradient(135deg,#f5f5f5,#e8e8e8); display:flex; align-items:center; justify-content:center; font-size:48px; color:#ccc;}
    .pro-fav {position:absolute; top:10px; right:10px; font-size:20px; color:#ccc; cursor:pointer;}
    .pro-fav.active {color:#FF4D4F;}
    .pro-rate-tag {position:absolute; bottom:10px; left:10px; background:var(--primary); color:#fff; font-size:12px; font-weight:600; padding:2px 10px; border-radius:12px;}
    .pro-info {padding:12px;}
    .pro-name {font-size:14px; line-height:20px; height:40px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; color:#333; font-weight:500;}
    .pro-bottom {display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
    .pro-price {font-size:18px; font-weight:700; color:var(--primary);}
    .pro-sold {font-size:12px; color:#aaa;}

    /* 底部导航：商城高亮 */
    .tab-bar {position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #eee; display:flex; padding:8px 0 10px; z-index:999;}
    .tab-item {flex:1; text-align:center; font-size:11px; color:#999; text-decoration:none;}
    .tab-item.active .tab-icon,
    .tab-item.active div:last-child {color:var(--primary);}
    .tab-icon {font-size:22px; margin-bottom:2px; display:block; color:#999;}
  </style>
</head>
<body>

  <!-- 顶部搜索栏 -->
  <div class="header">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="搜索商品、关键词...">
    </div>
  </div>

  <!-- 筛选：分类 + 国家 -->
  <div class="filter-wrap">
    <div class="filter-row">
      <span class="filter-tab active" onclick="switchCat(this)">全部</span>
      <span class="filter-tab" onclick="switchCat(this)">数码电子</span>
      <span class="filter-tab" onclick="switchCat(this)">服饰鞋包</span>
      <span class="filter-tab" onclick="switchCat(this)">美妆护肤</span>
      <span class="filter-tab" onclick="switchCat(this)">家居生活</span>
      <span class="filter-tab" onclick="switchCat(this)">食品生鲜</span>
      <span class="country-select" onclick="alert('选择国家/地区：中国、俄罗斯、吉尔吉斯斯坦...')">🌍 国家 ▾</span>
    </div>
  </div>

  <!-- 商品列表：完全对齐设计图 -->
  <div class="pro-list">
    <a href="#" class="pro-card" onclick="alert('进入商品详情页')">
      <div class="pro-img-wrap">📱
        <span class="pro-fav" onclick="event.stopPropagation(); toggleFav(this)">❤️</span>
        <span class="pro-rate-tag">佣金 12%</span>
      </div>
      <div class="pro-info">
        <div class="pro-name">Apple Watch Series</div>
        <div class="pro-bottom">
          <div class="pro-price">¥1,899</div>
          <div class="pro-sold">已售 2,341</div>
        </div>
      </div>
    </a>
    <a href="#" class="pro-card" onclick="alert('进入商品详情页')">
      <div class="pro-img-wrap">🍯
        <span class="pro-fav" onclick="event.stopPropagation(); toggleFav(this)">❤️</span>
        <span class="pro-rate-tag">佣金 15%</span>
      </div>
      <div class="pro-info">
        <div class="pro-name">俄罗斯天然蜂蜜 1000g 无污染</div>
        <div class="pro-bottom">
          <div class="pro-price">¥85.00</div>
          <div class="pro-sold">已售 4,200</div>
        </div>
      </div>
    </a>
    <a href="#" class="pro-card" onclick="alert('进入商品详情页')">
      <div class="pro-img-wrap">🎧
        <span class="pro-fav" onclick="event.stopPropagation(); toggleFav(this)">❤️</span>
        <span class="pro-rate-tag">佣金 12%</span>
      </div>
      <div class="pro-info">
        <div class="pro-name">高端无线蓝牙耳机 降噪续航50小时</div>
        <div class="pro-bottom">
          <div class="pro-price">¥128.50</div>
          <div class="pro-sold">已售 2,580</div>
        </div>
      </div>
    </a>
    <a href="#" class="pro-card" onclick="alert('进入商品详情页')">
      <div class="pro-img-wrap">👗
        <span class="pro-fav" onclick="event.stopPropagation(); toggleFav(this)">❤️</span>
        <span class="pro-rate-tag">佣金 8%</span>
      </div>
      <div class="pro-info">
        <div class="pro-name">春季新款时尚连衣裙 气质显瘦</div>
        <div class="pro-bottom">
          <div class="pro-price">¥199.00</div>
          <div class="pro-sold">已售 1,865</div>
        </div>
      </div>
    </a>
  </div>

  <!-- 底部导航：商城高亮 -->
  <div class="tab-bar">
    <a href="index.html" class="tab-item">
      <span class="tab-icon">🏠</span>
      <div>首页</div>
    </a>
    <a href="mall.html" class="tab-item active">
      <span class="tab-icon">🛍️</span>
      <div>商城</div>
    </a>
    <a href="task.html" class="tab-item">
      <span class="tab-icon">📋</span>
      <div>任务</div>
    </a>
    <a href="wallet.html" class="tab-item">
      <span class="tab-icon">💰</span>
      <div>钱包</div>
    </a>
    <a href="mine.html" class="tab-item">
      <span class="tab-icon">👤</span>
      <div>我的</div>
    </a>
  </div>

  <script>
    // 分类切换
    function switchCat(el){
      document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    }
    // 收藏切换
    function toggleFav(el){
      el.classList.toggle('active');
      el.style.color = el.classList.contains('active') ? '#FF4D4F' : '#ccc';
    }
  </script>
</body>
</html>
