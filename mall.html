<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商城 — 全球商家商城</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color:transparent;}
    :root {--primary:#FF6A00; --bg:#F5F5F5; --card:#fff; --text:#333; --text2:#888; --border:#eee;}
    html, body {background:var(--bg); max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:70px;}
    a {text-decoration:none; color:inherit; display:block;}

    /* 头部：头像左、搜索栏在下 → 互不压 */
    .header {background:linear-gradient(135deg, #FF6A00, #FF8A00); color:#fff; padding:30px 16px 24px; border-radius:0 0 24px 24px;}
    .header-top {display:flex; align-items:center; gap:12px; margin-bottom:12px;}
    .avatar {width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; font-size:22px; border:2px solid #fff; flex-shrink:0;}
    .search-bar {background:#fff; border-radius:24px; padding:10px 16px; display:flex; align-items:center; gap:8px;}
    .search-bar input {border:none; outline:none; flex:1; font-size:15px; color:#333;}

    /* 分类标签 */
    .tabs {display:flex; padding:12px 8px; gap:8px; overflow-x:auto; background:#fff; margin:12px; border-radius:10px;}
    .tab {white-space:nowrap; padding:6px 14px; border-radius:16px; font-size:14px; background:#f5f5f5; color:#666; cursor:pointer;}
    .tab.active {background:var(--primary); color:#fff;}

    /* 商品列表 */
    .pro-list {display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:0 12px;}
    .pro-card {background:#fff; border-radius:10px; overflow:hidden; cursor:pointer;}
    .pro-img {width:100%; aspect-ratio:1; background:linear-gradient(135deg,#f5f5f5,#e8e8e8); display:flex; align-items:center; justify-content:center; font-size:48px; color:#bbb;}
    .pro-info {padding:10px;}
    .pro-name {font-size:13px; line-height:18px; height:36px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; color:#333;}
    .pro-price {font-size:16px; font-weight:700; color:var(--primary); margin-top:6px;}
    .pro-sales {font-size:11px; color:#aaa; margin-top:4px;}

    /* 底部导航：商城自动高亮 */
    .tab-bar {position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #eee; display:flex; padding:8px 0 10px; z-index:999;}
    .tab-item {flex:1; text-align:center; font-size:11px; color:#999; text-decoration:none;}
    .tab-item.active .tab-icon,
    .tab-item.active div:last-child {color:var(--primary);}
    .tab-icon {font-size:22px; margin-bottom:2px; display:block; color:#999;}
  </style>
</head>
<body>

  <!-- 头部：头像左对齐，搜索栏完整在下 -->
  <div class="header">
    <div class="header-top">
      <a href="mine.html" class="avatar">👤</a>
    </div>
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="搜索商品、关键词...">
    </div>
  </div>

  <!-- 分类标签 -->
  <div class="tabs">
    <span class="tab active" onclick="switchTab(this)">全部</span>
    <span class="tab" onclick="switchTab(this)">数码电子</span>
    <span class="tab" onclick="switchTab(this)">服装服饰</span>
    <span class="tab" onclick="switchTab(this)">家居用品</span>
    <span class="tab" onclick="switchTab(this)">食品生鲜</span>
  </div>

  <!-- 商品列表 -->
  <div class="pro-list">
    <a href="#" class="pro-card">
      <div class="pro-img">🎧</div>
      <div class="pro-info">
        <div class="pro-name">高端无线蓝牙耳机 降噪续航50小时</div>
        <div class="pro-price">¥128.50</div>
        <div class="pro-sales">成交2580件</div>
      </div>
    </a>
    <a href="#" class="pro-card">
      <div class="pro-img">📱</div>
      <div class="pro-info">
        <div class="pro-name">智能手机全面屏 8GB+256GB 正品行货</div>
        <div class="pro-price">¥499.00</div>
        <div class="pro-sales">成交1890件</div>
      </div>
    </a>
  </div>

  <!-- 底部导航：商城高亮 -->
  <div class="tab-bar">
    <a href="index.html" class="tab-item">
      <span class="tab-icon">🏠</span>
      <div>首页</div>
    </a>
    <a href="mall.html" class="tab-item active">
      <span class="tab-icon">🛍️</span>
      <div>商城</div>
    </a>
    <a href="task.html" class="tab-item">
      <span class="tab-icon">📋</span>
      <div>任务</div>
    </a>
    <a href="wallet.html" class="tab-item">
      <span class="tab-icon">💰</span>
      <div>钱包</div>
    </a>
    <a href="mine.html" class="tab-item">
      <span class="tab-icon">👤</span>
      <div>我的</div>
    </a>
  </div>

  <script>
    function switchTab(el){
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
